<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090c" />
  <meta name="description" content="Seven premium Telegram Mini Apps in one obsidian glass portfolio." />
  <title>TMA Portfolio Suite</title>
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="./styles.css?v=3" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span>
    <span class="noise"></span>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" data-link aria-label="Portfolio home">
        <span class="brand-mark"><i></i><i></i></span>
        <span><b>SEOCRY</b><small>MINI APPS</small></span>
      </a>
      <div class="top-actions">
        <div class="language-switch" role="group" aria-label="Language">
          <button data-lang="ru">RU</button><button data-lang="en">EN</button><button data-lang="ua">UA</button>
        </div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="dock" aria-label="Mini apps">
      <a href="/meditation" data-link data-route="meditation"><span>◌</span><small data-i18n="navMeditation">Дыхание</small></a>
      <a href="/weather" data-link data-route="weather"><span>☼</span><small data-i18n="navWeather">Погода</small></a>
      <a href="/crypto" data-link data-route="crypto"><span>◇</span><small data-i18n="navCrypto">Крипто</small></a>
      <a href="/language" data-link data-route="language"><span>文</span><small data-i18n="navLanguage">Слова</small></a>
      <a href="/real-estate" data-link data-route="real-estate"><span>⌂</span><small data-i18n="navEstate">Недвижимость</small></a>
      <a href="/quiz" data-link data-route="quiz"><span>◎</span><small data-i18n="navQuiz">Квиз</small></a>
      <a href="/p2p" data-link data-route="p2p"><span>⇄</span><small data-i18n="navP2p">P2P</small></a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
